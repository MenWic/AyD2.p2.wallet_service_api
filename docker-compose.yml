services:

  wallet-postgres:
    image: postgres:17
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet_service_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_service_user -d wallet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wallet-service:
    image: registry.digitalocean.com/ayd2-p2/wallet-service:latest
    container_name: wallet-service
    depends_on:
      wallet-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_HOST}:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      EUREKA_INSTANCE_IPADDRESS: ${EUREKA_INSTANCE_IPADDRESS}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
      SECURITY_JWT_EXPIRATION_MINUTES: ${SECURITY_JWT_EXPIRATION_MINUTES}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      CONFERENCE_WALLET_SERVICE_TOKEN: ${CONFERENCE_WALLET_SERVICE_TOKEN}
    ports:
      - "8083:8083"
    restart: unless-stopped

volumes:
  wallet_pgdata:
