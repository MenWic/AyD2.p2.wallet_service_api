# ============================================================
# Configuracion produccion
# Proyecto AyD2 P2B
# ============================================================

spring.application.name=wallet-service

# server.port=8083
server.port=${SERVER_PORT:8083}

# ============================================================
# Datasource PostgreSQL
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wallet_service_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wallet_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Mostrar SQL solo en local. En produccion debe ir en false.
spring.jpa.show-sql=false

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ============================================================
# OpenAPI / Swagger
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# Seguridad / JWT
# Wallet no emite tokens; valida tokens emitidos por IAM.
# Debe usar el mismo secret que IAM mientras el proyecto use JWT simetrico.
# En produccion debe venir desde variables de entorno o secrets.
# ============================================================

security.jwt.secret=${SECURITY_JWT_SECRET:change_me_super_secret_key_at_least_32_chars_long}
security.jwt.expiration-minutes=${SECURITY_JWT_EXPIRATION_MINUTES:15}

# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${EUREKA_INSTANCE_IPADDRESS}

# ============================================================
# Conference -> Wallet service-to-service token
# Must equal the value conference-service sends as X-Service-Token.
# Set via CONFERENCE_WALLET_SERVICE_TOKEN in Secrets Manager.
# Missing or blank -> 500 system.internal_error on POST /payments/register.
# Wrong value -> 403 auth.forbidden.
# ============================================================

integration.conference.service-token=${CONFERENCE_WALLET_SERVICE_TOKEN:}
