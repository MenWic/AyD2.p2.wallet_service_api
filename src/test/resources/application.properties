spring.application.name=wallet-service-test

# JWT (test secret - at least 32 chars)
security.jwt.secret=test-secret-key-for-unit-tests-at-least-32-chars

# JPA / Flyway (overridden by Testcontainers @ServiceConnection in persistence tests)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable Eureka in tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
